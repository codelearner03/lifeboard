[phases.setup]
nixPkgs = ["dotnet-sdk_8"]
aptPkgs = ["dotnet-sdk-8.0"]

[phases.install]
cmds = []

[phases.build]
cmds = [
  "dotnet restore backend/LifeBoard.API/LifeBoard.API/LifeBoard.API.csproj",
  "dotnet publish backend/LifeBoard.API/LifeBoard.API/LifeBoard.API.csproj -c Release -o /app/publish"
]

[start]
cmd = "dotnet /app/publish/LifeBoard.API.dll"