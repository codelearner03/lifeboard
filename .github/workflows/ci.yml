name: LifeBoard CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/LifeBoard.API/backend/LifeBoard/LifeBoard.API/LifeBoard.API.csproj

      - name: Build
        run: dotnet build ./backend/LifeBoard.API/backend/LifeBoard/LifeBoard.API/LifeBoard.API.csproj --no-restore --configuration Release